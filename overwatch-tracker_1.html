<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오버워치 전적 기록</title>
<style>
  :root{
    --bg:#0f1115;
    --bg-gradient:#1b1f28;
    --panel:#181b22;
    --panel2:#1f232c;
    --border:#2a2f3a;
    --text:#eef0f3;
    --sub:#9aa3b2;
    --accent:#ff9c1a;
    --accent2:#ffb84d;
    --tank:#f5a623;
    --dps:#e2432a;
    --sup:#2fbf71;
    --danger:#e2432a;
    --radius:14px;
    --hover-overlay:rgba(255,255,255,0.05);
    --neutral-pill:rgba(255,255,255,0.1);
    --btn-secondary-hover:#262b36;
    --win-bg:#123a26;
    --win-border:#1e8a56;
    --lose-bg:#3a1518;
    --lose-border:#a33636;
  }
  html[data-theme="light"]{
    --bg:#faf6ec;
    --bg-gradient:#fffaf0;
    --panel:#fffdf8;
    --panel2:#f3ecdc;
    --border:#e2d8c3;
    --text:#3a352c;
    --sub:#8a8071;
    --accent:#ff9c1a;
    --accent2:#e8890f;
    --tank:#c9821a;
    --dps:#c2432a;
    --sup:#1f9d5c;
    --danger:#c2432a;
    --hover-overlay:rgba(0,0,0,0.04);
    --neutral-pill:rgba(0,0,0,0.06);
    --btn-secondary-hover:#e9e1cd;
    --win-bg:#e1f6e8;
    --win-border:#a9e0bc;
    --lose-bg:#fbe3e2;
    --lose-border:#f1b6b3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:radial-gradient(circle at top, var(--bg-gradient) 0%, var(--bg) 60%);
    color:var(--text);
    min-height:100vh;
    padding-bottom:60px;
    transition:background .2s ease, color .2s ease;
  }
  header{
    position:relative;
    padding:56px 24px 48px;
    text-align:center;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, rgba(255,156,26,0.08), transparent);
  }
  .theme-toggle-btn{
    position:absolute;
    top:18px;
    right:20px;
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .theme-toggle-btn:hover{border-color:var(--accent);}
  .title-edit-btn{
    position:absolute;
    top:60px;
    right:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    font-size:15px;
    cursor:pointer;
    line-height:1;
    padding:0;
  }
  .title-edit-btn:hover{border-color:var(--accent);}
  .title-edit-btn.active{border-color:var(--accent);background:var(--accent);color:#1b1300;}
  header h1{
    margin:0 0 4px;
    font-size:26px;
    letter-spacing:1px;
    background:linear-gradient(90deg, var(--accent), #ffe08a);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{margin:0;color:var(--sub);font-size:13px;}
  header h1[contenteditable="true"], header p[contenteditable="true"]{
    outline:none;
    cursor:text;
    border-radius:8px;
    box-shadow:0 0 0 2px var(--accent2);
    padding:2px 8px;
    background:var(--hover-overlay);
    -webkit-text-fill-color:var(--text);
    max-width:calc(100% - 130px);
    margin-left:auto;
    margin-right:auto;
  }
  header h1[contenteditable="true"]{
    background:var(--hover-overlay);
  }

  .toolbar{
    max-width:1960px;
    margin:20px auto 0;
    padding:0 12px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    justify-content:space-between;
  }
  .toolbar-left, .toolbar-right{display:flex;gap:8px;flex-wrap:wrap;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:10px;
    padding:10px 16px;
    font-size:13px;
    font-weight:600;
    transition:transform .12s ease, filter .12s ease;
  }
  button:active{transform:scale(0.96);}
  .btn-primary{background:linear-gradient(135deg, var(--accent), #ff7a00);color:#1a1200;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  .btn-secondary:hover{background:var(--btn-secondary-hover);}
  .btn-danger{background:rgba(226,67,42,0.15);color:#ff8a73;border:1px solid rgba(226,67,42,0.4);}
  .btn-danger:hover{background:rgba(226,67,42,0.28);}
  .btn-ghost{background:transparent;color:var(--sub);border:1px solid var(--border);}
  input[type=file]{display:none;}

  .summary-bar{
    max-width:1960px;
    margin:16px auto 0;
    padding:0 12px;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:14px;
  }
  .stat-tile{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px 18px;
    text-align:center;
  }
  .stat-tile .num{font-size:30px;font-weight:800;white-space:nowrap;}
  .stat-tile .num.num-sm{font-size:22px;white-space:normal;line-height:1.3;word-break:keep-all;}
  .stat-tile .lbl{font-size:13px;color:var(--sub);margin-top:4px;}
  .stat-tile.win .num{color:var(--sup);}
  .stat-tile.lose .num{color:var(--dps);}

  main{max-width:1960px;margin:22px auto;padding:0 12px;}
  .table-wrap{overflow-x:auto;padding-bottom:6px;}
  .table-wrap::-webkit-scrollbar{height:8px;}
  .grid{
    display:flex;
    flex-direction:column;
    gap:10px;
    min-width:1350px;
  }
  .empty-state{
    text-align:center;
    padding:70px 20px;
    color:var(--sub);
    border:1px dashed var(--border);
    border-radius:var(--radius);
    min-width:0;
  }
  .row-header{
    display:flex;align-items:center;gap:8px;
    padding:0 12px 6px;
    font-size:11px;color:var(--sub);font-weight:700;
    flex-wrap:nowrap;
    min-width:1350px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .card.result-win{background:var(--win-bg);border-color:var(--win-border);}
  .card.result-lose{background:var(--lose-bg);border-color:var(--lose-border);}
  .card-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:nowrap;
    padding:10px 12px;
  }
  .memo-cell{display:flex;align-items:center;justify-content:center;gap:4px;max-width:100%;min-width:0;cursor:default;}
  .memo-toggle{
    flex-shrink:0;cursor:pointer;font-size:9px;line-height:1;color:var(--sub);
    padding:3px 4px;border-radius:5px;display:inline-flex;
  }
  .memo-toggle:hover{color:var(--accent);background:rgba(255,156,26,0.12);}
  .memo-full-panel{padding:0 16px 14px;}
  .memo-full-text{
    background:var(--panel2);border-radius:10px;padding:10px 12px;
    font-size:12.5px;color:var(--text);white-space:pre-wrap;word-break:break-word;line-height:1.55;
  }

  .col-role{flex:0 0 100px;text-align:center;}
  .col-hero{flex:0 0 150px;min-width:0;text-align:center;}
  .col-tier{flex:0 0 156px;text-align:center;}
  .col-progress{flex:0 0 82px;text-align:center;}
  .col-map{flex:0 0 140px;text-align:center;}
  .col-date{flex:0 0 96px;text-align:center;}
  .col-result{flex:0 0 56px;text-align:center;}
  .col-kda{flex:0 0 110px;text-align:center;}
  .col-amount{flex:0 0 110px;text-align:center;}
  .col-memo{flex:1 1 160px;min-width:120px;text-align:center;}
  .col-actions{flex:0 0 92px;text-align:center;}

  .card-top{display:flex;align-items:center;gap:12px;}
  .portrait-wrap{
    width:40px;height:40px;border-radius:50%;
    overflow:hidden;flex-shrink:0;
    border:2px solid var(--border);
    background:var(--panel2);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:15px;
  }
  .portrait-wrap img{width:100%;height:100%;object-fit:cover;}
  .role-tank{color:var(--tank);border-color:var(--tank);}
  .role-dps{color:var(--dps);border-color:var(--dps);}
  .role-sup{color:var(--sup);border-color:var(--sup);}
  .card-title{min-width:0;}
  .card-title .hero-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .role-tag{
    display:inline-block;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:20px;
    white-space:nowrap;
  }
  .role-tag.role-tank{background:rgba(245,166,35,0.15);}
  .role-tag.role-dps{background:rgba(226,67,42,0.15);}
  .role-tag.role-sup{background:rgba(47,191,113,0.15);}

  .tier-badge{position:relative;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub);white-space:nowrap;}
  .tier-badge img{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:22px;height:22px;object-fit:contain;}
  .tier-badge .tier-label{width:100%;text-align:center;font-size:14px;font-weight:800;color:var(--text);}
  .tier-badge .tier-fallback{
    width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--panel2);font-size:12px;flex-shrink:0;
  }

  .map-cell{display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
  .map-cell .map-mode-icon{font-size:14px;flex-shrink:0;}
  .map-cell .map-name{font-size:13px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;}

  .progress-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
  .progress-cell .progress-value{display:block;width:100%;text-align:center;font-size:15px;font-weight:800;color:var(--text);}
  .progress-cell .progress-delta{display:block;width:100%;text-align:center;font-size:11px;font-weight:700;white-space:nowrap;}
  .progress-cell .progress-delta.up{color:#128a45;}
  .progress-cell .progress-delta.down{color:#ff4d5e;}
  .progress-cell .progress-delta.flat{color:var(--sub);}

  /* 날짜가 바뀌는 지점에 끼워넣는, 그 날의 최종 티어/진척도 변화 요약 행 */
  .day-summary-row{
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
    padding:9px 16px;border-radius:10px;
    background:var(--panel2);border:1px dashed var(--border);
    font-size:12px;color:var(--sub);
  }
  .day-summary-date{font-weight:800;color:var(--text);}
  .day-summary-sep{color:var(--border);}
  .day-summary-tier{display:flex;align-items:center;gap:5px;}
  .day-summary-tier img{width:16px;height:16px;}
  .day-summary-tier strong{color:var(--text);font-weight:800;}
  .day-summary-total{font-weight:700;}
  .day-summary-delta.up{color:#128a45;}
  .day-summary-delta.down{color:#ff4d5e;}
  .day-summary-delta.flat{color:var(--sub);}

  .map-mode-tag{
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap;
    background:var(--panel2);color:var(--sub);border:1px solid var(--border);
  }
  .map-mode-tag.mode-control{background:rgba(77,168,255,0.15);color:#4da8ff;border-color:rgba(77,168,255,0.4);}
  .map-mode-tag.mode-escort{background:rgba(47,191,113,0.15);color:var(--sup);border-color:rgba(47,191,113,0.4);}
  .map-mode-tag.mode-hybrid{background:rgba(155,93,229,0.15);color:#9b5de5;border-color:rgba(155,93,229,0.4);}
  .map-mode-tag.mode-push{background:rgba(245,166,35,0.15);color:var(--tank);border-color:rgba(245,166,35,0.4);}
  .map-mode-tag.mode-flashpoint{background:rgba(226,67,42,0.15);color:var(--dps);border-color:rgba(226,67,42,0.4);}
  .map-mode-tag.mode-clash{background:rgba(255,77,94,0.15);color:#ff4d5e;border-color:rgba(255,77,94,0.4);}

  .date-text{font-size:12px;color:var(--sub);white-space:nowrap;}
  .result-pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .result-pill.WIN{background:rgba(47,191,113,0.18);color:var(--sup);}
  .result-pill.LOSE{background:rgba(226,67,42,0.18);color:#ff8a73;}
  .result-pill.DRAW{background:var(--neutral-pill);color:var(--sub);}

  .kda-value{font-weight:800;font-size:15px;color:var(--text);letter-spacing:0.8px;white-space:nowrap;}
  .kda-value .kda-sep{color:var(--sub);font-weight:400;margin:0 3px;}
  .kda-value .kda-kill{color:#4da8ff;}
  .kda-value .kda-death{color:#ff4d5e;}
  .amount-value{font-weight:800;font-size:15px;letter-spacing:0.6px;white-space:nowrap;}
  .amount-value.amount-dmg{color:#ff9c1a;}
  .amount-value.amount-heal{color:#2ee67f;}
  .stat-empty{font-size:11px;color:var(--sub);opacity:.5;}

  .memo-box{
    font-size:12px;color:var(--sub);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    max-width:100%;min-width:0;
  }
  .memo-empty{opacity:.4;}
  .card-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap;}
  .card-actions button{padding:6px 10px;font-size:14px;line-height:1;white-space:nowrap;}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(5,6,9,0.72);
    display:none;align-items:flex-start;justify-content:center;
    padding:30px 14px;overflow-y:auto;z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    width:100%;max-width:640px;
    padding:22px;
    animation:pop .15s ease;
  }
  @keyframes pop{from{transform:translateY(8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal h2{margin:0 0 16px;font-size:18px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px;font-weight:600;}
  .field input[type=date], .field input[type=number], .field input[type=text], .field textarea, .field select{
    width:100%;padding:10px 12px;border-radius:10px;
    border:1px solid var(--border);background:var(--panel2);color:var(--text);
    font-family:inherit;font-size:13.5px;
  }
  .field textarea{resize:vertical;min-height:64px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

  .role-select{display:flex;gap:8px;}
  .role-btn{
    flex:1;padding:10px;border-radius:10px;text-align:center;cursor:pointer;
    border:1px solid var(--border);background:var(--panel2);font-weight:700;font-size:13px;
    color:var(--sub);
  }
  .role-btn.active.tank{border-color:var(--tank);color:var(--tank);background:rgba(245,166,35,0.12);}
  .role-btn.active.dps{border-color:var(--dps);color:var(--dps);background:rgba(226,67,42,0.12);}
  .role-btn.active.sup{border-color:var(--sup);color:var(--sup);background:rgba(47,191,113,0.12);}

  .tier-select{display:flex;gap:10px;align-items:center;}
  .tier-select select{flex:1;}
  .tier-preview{
    width:38px;height:38px;border-radius:50%;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;
    border:1px solid var(--border);
  }
  .tier-preview img{width:100%;height:100%;object-fit:contain;}

  .hero-trigger{
    display:flex;align-items:center;gap:10px;cursor:pointer;
    border:1px solid var(--border);border-radius:12px;padding:8px 12px;
    background:var(--panel2);
    transition:border-color .12s ease;
  }
  .hero-trigger:hover{border-color:var(--accent);}
  .hero-trigger.open{border-color:var(--accent);border-bottom-left-radius:0;border-bottom-right-radius:0;}
  .hero-trigger .mini{
    width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--panel);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;
  }
  .hero-trigger .mini img{width:100%;height:100%;object-fit:cover;}
  .hero-trigger-text{flex:1;min-width:0;}
  .hero-trigger-text .hname{font-size:14px;font-weight:700;}
  .hero-trigger-text .hrole{font-size:11px;color:var(--sub);margin-top:1px;}
  .chevron{color:var(--sub);font-size:12px;transition:transform .15s ease;flex-shrink:0;}
  .hero-trigger.open .chevron{transform:rotate(180deg);}
  .hero-panel{
    display:none;
    border:1px solid var(--accent);border-top:none;
    border-bottom-left-radius:12px;border-bottom-right-radius:12px;
    overflow:hidden;
  }
  .hero-panel.open{display:block;}
  .hero-panel .hero-picker{border:none;border-radius:0;}

  .hero-picker{border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--panel2);}
  .hero-search{
    width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);font-size:13px;margin-bottom:8px;
  }
  .hero-list{max-height:190px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
  .hero-item{
    display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer;
  }
  .hero-item:hover{background:var(--hover-overlay);}
  .hero-item.selected{background:rgba(255,156,26,0.15);outline:1px solid var(--accent);}
  .hero-item .mini{
    width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--panel);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;
  }
  .hero-item .mini img{width:100%;height:100%;object-fit:cover;}
  .hero-item .hname{font-size:13px;}
  .hero-item .hrole{font-size:10px;color:var(--sub);margin-left:auto;}
  .fav-star{
    flex-shrink:0;font-size:15px;line-height:1;color:var(--sub);cursor:pointer;
    width:18px;text-align:center;
  }
  .fav-star:hover{color:var(--accent2);}
  .fav-star.active{color:var(--accent);}
  .hero-check{
    flex-shrink:0;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;
    color:transparent;background:transparent;transition:all .12s ease;
  }
  .hero-check.checked{background:var(--accent);border-color:var(--accent);color:#fff;}

  .portrait-stack{display:flex;align-items:center;justify-content:center;}
  .stack-item{
    border-radius:50%;overflow:hidden;background:var(--panel);box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;
    border:2px solid var(--panel2);position:relative;
  }
  .stack-item img{width:100%;height:100%;object-fit:cover;}
  .portrait-stack .stack-item:not(:first-child){margin-left:-14px;}

  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
  .hint{font-size:11px;color:var(--sub);margin-top:16px;line-height:1.6;padding:10px 12px;background:var(--panel2);border-radius:10px;}
  .custom-hero-row{display:flex;gap:8px;margin-top:8px;}
  .custom-hero-row input{flex:1;}

  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
</style>
</head>
<body>

<header>
  <button type="button" class="theme-toggle-btn" id="themeToggleBtn"><span id="themeToggleIcon">🌙</span><span id="themeToggleLabel">다크 모드</span></button>
  <button type="button" class="title-edit-btn" id="titleEditBtn" title="제목 편집" aria-label="제목 편집">✏️</button>
  <h1 id="headerTitle">🎮 오버워치 전적 기록</h1>
  <p id="headerSubtitle">티어 · 맵 · 날짜 · 역할군 · 영웅 · 스탯 · 메모를 기록하고 관리하세요</p>
</header>

<div class="toolbar">
  <div class="toolbar-left">
    <button class="btn-primary" id="openAddBtn">＋ 기록 추가</button>
  </div>
  <div class="toolbar-right">
    <button class="btn-secondary" id="exportJsonBtn">⭳ JSON 내보내기</button>
    <button class="btn-secondary" id="exportCsvBtn">⭳ CSV 내보내기</button>
    <button class="btn-secondary" id="importBtn">⭱ JSON 불러오기</button>
    <input type="file" id="importFile" accept="application/json">
    <button class="btn-ghost" id="clearAllBtn">전체 삭제</button>
  </div>
</div>

<div class="summary-bar" id="summaryBar"></div>

<main>
  <div class="table-wrap">
    <div class="row-header">
      <div class="col-role">역할군</div>
      <div class="col-hero">영웅</div>
      <div class="col-tier">티어</div>
      <div class="col-progress">진척도</div>
      <div class="col-map">맵</div>
      <div class="col-date">날짜</div>
      <div class="col-result">결과</div>
      <div class="col-kda">K/A/D</div>
      <div class="col-amount">딜량/힐량</div>
      <div class="col-memo">메모</div>
      <div class="col-actions"></div>
    </div>
    <div class="grid" id="cardGrid"></div>
  </div>
</main>

<!-- Add/Edit Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">새 기록 추가</h2>
    <div id="recordForm">
      <div class="row2">
        <div class="field">
          <label>날짜</label>
          <input type="date" id="f-date">
        </div>
        <div class="field">
          <label>결과</label>
          <select id="f-result">
            <option value="WIN">승리</option>
            <option value="LOSE">패배</option>
            <option value="DRAW">무승부</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>티어</label>
        <div class="tier-select">
          <select id="f-tier"></select>
          <select id="f-division" style="max-width:110px;"></select>
          <div class="tier-preview" id="tierPreview"></div>
        </div>
      </div>

      <div class="field">
        <label>진척도 (%) <span style="color:var(--sub);font-weight:400;">선택 입력 · 현재 티어/단계 내 진행률</span></label>
        <input type="number" id="f-progress" min="0" max="100" step="1" placeholder="예: 45">
      </div>

      <div class="field">
        <label>맵 (클릭해서 변경)</label>
        <div class="hero-trigger" id="mapTrigger">
          <span class="map-mode-tag" id="mapTriggerModeTag">모드</span>
          <div class="hero-trigger-text">
            <div class="hname" id="mapTriggerName">맵을 선택하세요</div>
          </div>
          <div class="chevron" id="mapTriggerChevron">▾</div>
        </div>
        <div class="hero-panel" id="mapPanel">
          <div class="hero-picker">
            <input type="text" class="hero-search" id="mapSearch" placeholder="맵 이름 검색... (예: 리알토, 오아시스)">
            <div class="hero-list" id="mapList"></div>
            <div class="custom-hero-row">
              <input type="text" id="customMapInput" placeholder="목록에 없는 맵? 직접 입력">
              <button type="button" class="btn-secondary" id="addCustomMapBtn">추가</button>
            </div>
          </div>
        </div>
      </div>

      <div class="field">
        <label>역할군</label>
        <div class="role-select">
          <div class="role-btn tank" data-role="탱커">🛡 탱커</div>
          <div class="role-btn dps" data-role="딜러">🎯 딜러</div>
          <div class="role-btn sup" data-role="힐러">✚ 힐러</div>
        </div>
      </div>

      <div class="field">
        <label>영웅 (클릭해서 변경)</label>
        <div class="hero-trigger" id="heroTrigger">
          <div class="mini" id="heroTriggerPortrait">?</div>
          <div class="hero-trigger-text">
            <div class="hname" id="heroTriggerName">영웅을 선택하세요</div>
            <div class="hrole" id="heroTriggerRole"></div>
          </div>
          <div class="chevron" id="heroTriggerChevron">▾</div>
        </div>
        <div class="hero-panel" id="heroPanel">
          <div class="hero-picker">
            <input type="text" class="hero-search" id="heroSearch" placeholder="영웅 이름 검색... (예: 트레이서, tracer)">
            <div class="hero-list" id="heroList"></div>
            <div class="custom-hero-row">
              <input type="text" id="customHeroInput" placeholder="목록에 없는 영웅? 직접 입력">
              <button type="button" class="btn-secondary" id="addCustomHeroBtn">추가</button>
            </div>
          </div>
        </div>
      </div>

      <div class="field">
        <label>스탯 (선택 입력)</label>
        <div class="row3">
          <div><label>킬</label><input type="number" id="f-kills" min="0" placeholder="0"></div>
          <div><label>데스</label><input type="number" id="f-deaths" min="0" placeholder="0"></div>
          <div><label>어시스트</label><input type="number" id="f-assists" min="0" placeholder="0"></div>
        </div>
        <div style="margin-top:10px;">
          <label id="f-stat-label" style="display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px;font-weight:600;">딜량</label>
          <input type="number" id="f-stat-amount" min="0" placeholder="0">
        </div>
      </div>

      <div class="field">
        <label>메모</label>
        <textarea id="f-memo" placeholder="경기 특이사항, 느낀점, 조합 등을 자유롭게 적어보세요"></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancelBtn">취소</button>
        <button type="button" class="btn-primary" id="saveBtn">저장</button>
      </div>
    </div>
  </div>
</div>

function tierIconDataUrl(t){
  // 실제 오버워치 티어 아이콘 이미지가 있으면 그걸 사용 (인라인 base64 - 네트워크 의존 없음)
  if(TIER_ICON_IMAGES[t.key]) return TIER_ICON_IMAGES[t.key];
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">'
    + '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="' + t.grad[0] + '"/>'
    + '<stop offset="100%" stop-color="' + t.grad[1] + '"/>'
    + '</linearGradient></defs>'
    + '<polygon points="50,3 92,26 92,74 50,97 8,74 8,26" fill="url(#g)" stroke="' + t.ring + '" stroke-width="4"/>'
    + '<text x="50" y="64" font-size="40" text-anchor="middle" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">' + t.emoji + '</text>'
    + '</svg>';
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

/* ---------------------------------------------------------
   로컬 저장(브라우저) - 새로고침/재접속 후에도 데이터 유지
   * 이 파일을 브라우저에서 직접 열어서 사용할 때만 정상 동작합니다.
--------------------------------------------------------- */
const STORAGE_KEY_RECORDS = 'ow_tracker_records_v1';
const STORAGE_KEY_TITLE = 'ow_tracker_title_v1';
const STORAGE_KEY_SUBTITLE = 'ow_tracker_subtitle_v1';
const STORAGE_KEY_LAST_FORM = 'ow_tracker_last_form_v1';
/* "새 기록 추가" 시 맵/메모/스탯을 제외한 나머지 입력값(날짜·결과·티어·진척도·역할군·영웅)을
   마지막에 입력했던 값 그대로 기억해두기 위한 저장/불러오기 */
function saveLastFormToStorage(data){
  try{
    localStorage.setItem(STORAGE_KEY_LAST_FORM, JSON.stringify(data));
  }catch(err){
    console.warn('마지막 입력값을 저장하지 못했습니다:', err);
  }
}
function loadLastFormFromStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY_LAST_FORM);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(err){
    console.warn('마지막 입력값을 불러오지 못했습니다:', err);
    return null;
  }
}
function saveRecordsToStorage(){
  try{
    localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records));
  }catch(err){
    console.warn('기록을 브라우저에 저장하지 못했습니다:', err);
  }
}
/* 예전 버전(영웅 1명, rec.hero)으로 저장된 기록도 문제없이 표시되도록
   rec.heroes(배열) 형태로 맞춰줌 */
function normalizeRecord(rec){
  if(!rec) return rec;
  if(!Array.isArray(rec.heroes) || rec.heroes.length === 0){
    rec.heroes = rec.hero ? [rec.hero] : [{name:'알 수 없음', role: rec.role || '딜러', en:null}];
  }
  return rec;
}
function loadRecordsFromStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY_RECORDS);
    if(!raw) return;
    const data = JSON.parse(raw);
    if(Array.isArray(data)) records = data.map(normalizeRecord);
  }catch(err){
    console.warn('저장된 기록을 불러오지 못했습니다:', err);
  }
}
function saveTitleToStorage(title, subtitle){
  try{
    localStorage.setItem(STORAGE_KEY_TITLE, title);
    localStorage.setItem(STORAGE_KEY_SUBTITLE, subtitle);
  }catch(err){
    console.warn('제목을 브라우저에 저장하지 못했습니다:', err);
  }
}
function loadTitleFromStorage(){
  try{
    return {
      title: localStorage.getItem(STORAGE_KEY_TITLE),
      subtitle: localStorage.getItem(STORAGE_KEY_SUBTITLE),
    };
  }catch(err){
    console.warn('저장된 제목을 불러오지 못했습니다:', err);
    return {title:null, subtitle:null};
  }
}

/* ---------------------------------------------------------

--------------------------------------------------------- */
function uid(){ return "r" + Math.random().toString(36).slice(2,10) + Date.now(); }
function esc(s){ return (s||"").toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function tierInfo(key){ return TIERS.find(t=>t.key===key) || TIERS[0]; }

/* ---------------------------------------------------------
   진척도(%) 계산
   - 티어/단계가 바뀌어도 이어지는 하나의 진행 척도로 환산해서
     이전 기록과의 변화량(%)을 계산한다.
   - 단계는 5(낮음) -> 1(높음) 순서이며, 한 단계=100 만큼의 값으로 취급.
--------------------------------------------------------- */
function clampProgress(v){
  if(v === null || v === undefined || Number.isNaN(v)) return null;
  return Math.max(0, Math.min(100, v));
}
function progressRankValue(tierKey, division, percent){
  const idx = TIERS.findIndex(t=>t.key===tierKey);
  if(idx < 0 || percent === null || percent === undefined) return null;
  const divStep = (tierKey === 'top500' || !division) ? 0 : (5 - division);
  return (idx*5 + divStep) * 100 + percent;
}
function computeProgressDelta(rec, prevRec){
  if(!rec || rec.progress===null || rec.progress===undefined) return null;
  if(!prevRec || prevRec.progress===null || prevRec.progress===undefined) return null;
  const cur = progressRankValue(rec.tier, rec.division, rec.progress);
  const prev = progressRankValue(prevRec.tier, prevRec.division, prevRec.progress);
  if(cur === null || prev === null) return null;
  return cur - prev;
}

/* 위키 pageimages API로 영웅 초상화를 실시간 검색해서 가져옴 (원본 파일명을 몰라도 됨) */
async function fetchHeroPortrait(enName){
  if(!enName) return null;
  if(portraitCache[enName] !== undefined) return portraitCache[enName];
  try{
    const url = "https://overwatch.fandom.com/api.php?action=query&titles=" +
      encodeURIComponent(enName) +
      "&prop=pageimages&piprop=thumbnail&pithumbsize=300&format=json&origin=*";
    const res = await fetch(url);
    const data = await res.json();
    const pages = data.query && data.query.pages;
    let found = null;
    if(pages){
      const page = Object.values(pages)[0];
      if(page && page.thumbnail && page.thumbnail.source){
        found = page.thumbnail.source;
      }
    }
    portraitCache[enName] = found;
    return found;
  }catch(e){
    portraitCache[enName] = null;
    return null;
  }
}

/* 초상화 <img>를 채워주는 헬퍼: 로딩 실패/미검색 시 이니셜 아바타로 대체 */
function mountPortrait(container, hero){
  const roleClass = ROLE_CLASS[hero.role] || "dps";
  container.className = container.className.split(' ').filter(c=>!c.startsWith('role-')).join(' ');
  container.classList.add('role-'+roleClass);
  container.innerHTML = (hero.name||'?').slice(0,1);
  // 1순위: 내장된 초상화 이미지(네트워크 없이 항상 표시됨)
  const embedded = HERO_PORTRAIT_IMAGES[hero.name];
  if(embedded){
    const img = document.createElement('img');
    img.src = embedded;
    img.alt = hero.name;
    container.innerHTML = '';
    container.appendChild(img);
    return;
  }
  if(!hero.en){ return; } // 커스텀 영웅(영문명 없음)은 이니셜만 표시
  // 2순위: 내장 이미지가 없는 영웅은 팬덤 위키에서 실시간으로 검색해서 가져옴
  fetchHeroPortrait(hero.en).then(url=>{
    if(url){
      const img = document.createElement('img');
      img.src = url;
      img.alt = hero.name;
      img.onerror = () => { container.innerHTML = (hero.name||'?').slice(0,1); };
      container.innerHTML = '';
      container.appendChild(img);
    }
  });
}

/* 여러 영웅을 겹친 초상화 묶음으로 표시하는 헬퍼.
   heroesArr의 순서대로 왼쪽부터 겹쳐 그리며, 마지막(가장 나중에 체크한) 영웅이
   DOM상 맨 뒤에 그려져 시각적으로 맨 위(앞)에 보임. container 자체의 기존
   클래스(예: col-hero, card-title)는 그대로 두고 role-* 표시용 클래스만 정리함. */
function mountPortraitStack(container, heroesArr, opts){
  opts = opts || {};
  const size = opts.size || 32;
  container.innerHTML = '';
  container.className = container.className
    .split(' ')
    .filter(c => c && !c.startsWith('role-') && c !== 'mini' && c !== 'portrait-stack')
    .join(' ');
  if(!heroesArr || heroesArr.length === 0){
    container.classList.add('mini');
    container.textContent = '?';
    return;
  }
  container.classList.add('portrait-stack');
  heroesArr.forEach(h=>{
    const item = document.createElement('div');
    item.className = 'stack-item';
    item.style.width = size + 'px';
    item.style.height = size + 'px';
    mountPortrait(item, h);
    container.appendChild(item);
  });
  container.title = heroesArr.map(h=>h.name).join(', ');
}

const roleBtns = document.querySelectorAll('.role-btn');
function statLabelForRole(role){ return role === '힐러' ? '힐량' : '딜량'; }
// 역할군의 기본 선택 영웅: 즐겨찾기가 있으면 그 중 첫번째, 없으면 목록의 아무 영웅(첫번째)
function getDefaultHeroForRole(role){
  const list = HEROES.filter(h => h.role === role);
  if(list.length === 0) return null;
  const favInRole = list.find(h => favoriteHeroes.has(h.name));
  return favInRole || list[0];
}
function setRole(role){
  const prevRole = selectedRole;
  selectedRole = role;
  roleBtns.forEach(b=>b.classList.toggle('active', b.dataset.role===role));
  document.getElementById('f-stat-label').textContent = statLabelForRole(role);
  // 역할군이 바뀌면 이전 역할군 기준으로 체크했던 영웅들은 더 이상 유효하지 않으므로 체크 해제
  if(prevRole !== role || selectedHeroes.some(h => h.role !== role)){
    selectedHeroes = [];
    updateHeroTriggerDisplay();
  }
  renderHeroList();
}
roleBtns.forEach(b=> b.addEventListener('click', ()=> setRole(b.dataset.role)) );

const heroSearchInput = document.getElementById('heroSearch');
const heroListEl = document.getElementById('heroList');

const heroTriggerPortrait = document.getElementById('heroTriggerPortrait');
const heroTriggerName = document.getElementById('heroTriggerName');

const heroPanel = document.getElementById('heroPanel');

function openHeroPanel(){
  heroPanel.classList.add('open');
  heroTrigger.classList.add('open');
  heroSearchInput.value = '';
  renderHeroList();
  setTimeout(()=> heroSearchInput.focus(), 0);
}
function closeHeroPanel(){
  heroPanel.classList.remove('open');
  heroTrigger.classList.remove('open');
}
function toggleHeroPanel(){
  if(heroPanel.classList.contains('open')) closeHeroPanel();
  else openHeroPanel();
}
heroTrigger.addEventListener('click', toggleHeroPanel);

// 즐겨찾기(선호 표기)한 영웅 이름 목록 - 검색 목록 맨 위에 노출됨
const favoriteHeroes = new Set();
// 메모를 펼쳐서 전체 보기 중인 기록 id 목록
const expandedMemos = new Set();

function renderHeroList(){
  const q = heroSearchInput.value.trim().toLowerCase();
  const list = HEROES.filter(h => h.role === selectedRole).filter(h=>{
    if(!q) return true;
    return h.name.toLowerCase().includes(q) || (h.en||'').toLowerCase().includes(q);
  });
  // 즐겨찾기한 영웅을 목록 맨 위로 정렬 (그 외 순서는 유지)
  list.sort((a,b)=>{
    const fa = favoriteHeroes.has(a.name) ? 0 : 1;
    const fb = favoriteHeroes.has(b.name) ? 0 : 1;
    return fa - fb;
  });
  heroListEl.innerHTML = '';
  if(list.length === 0){
    heroListEl.innerHTML = '<div style="color:var(--sub);font-size:12px;padding:8px;">검색 결과가 없습니다. 아래에서 직접 추가해보세요.</div>';
    return;
  }
  list.forEach(h=>{
    const isFav = favoriteHeroes.has(h.name);
    const isChecked = isHeroChecked(h);
    const item = document.createElement('div');
    item.className = 'hero-item' + (isChecked ? ' selected' : '');
    const check = document.createElement('span');
    check.className = 'hero-check' + (isChecked ? ' checked' : '');
    check.textContent = '✓';
    const star = document.createElement('span');
    star.className = 'fav-star' + (isFav ? ' active' : '');
    star.textContent = isFav ? '★' : '☆';
    star.title = isFav ? '선호 해제' : '선호로 표시 (목록 상단에 고정)';
    star.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(favoriteHeroes.has(h.name)) favoriteHeroes.delete(h.name);
      else favoriteHeroes.add(h.name);
      renderHeroList();
    });
    const mini = document.createElement('div');
    mini.className = 'mini';
    mountPortrait(mini, h);
    const nameEl = document.createElement('div');
    nameEl.className = 'hname'; nameEl.textContent = h.name;
    const roleEl = document.createElement('div');
    roleEl.className = 'hrole'; roleEl.textContent = ROLE_ICON[h.role] + ' ' + h.role;
    item.appendChild(check); item.appendChild(star); item.appendChild(mini); item.appendChild(nameEl); item.appendChild(roleEl);
    item.addEventListener('click', ()=> toggleHeroChecked(h));
    heroListEl.appendChild(item);
  });
}
heroSearchInput.addEventListener('input', renderHeroList);

/* 영웅 여러 명 체크(다중 선택) 처리 */
function isHeroChecked(h){
  return selectedHeroes.some(x => x.name === h.name);
}
function toggleHeroChecked(h){
  const idx = selectedHeroes.findIndex(x => x.name === h.name);
  if(idx > -1){
    selectedHeroes.splice(idx, 1); // 이미 체크된 영웅을 다시 클릭하면 체크 해제
  } else {
    selectedHeroes.push(h); // 새로 체크한 영웅은 배열 맨 끝(=맨 위에 표시)에 추가
  }
  updateHeroTriggerDisplay();
  renderHeroList();
}
/* 트리거 박스(선택 버튼)에 체크된 영웅들의 겹친 초상화 + 이름을 표시 */
function updateHeroTriggerDisplay(){
  mountPortraitStack(heroTriggerPortrait, selectedHeroes, {size:36});
  if(selectedHeroes.length === 0){
    heroTriggerName.textContent = '영웅을 선택하세요';
    heroTriggerRole.textContent = '';
    return;
  }
  heroTriggerName.textContent = selectedHeroes.map(h=>h.name).join(', ');
  heroTriggerRole.textContent = ROLE_ICON[selectedHeroes[0].role] + ' ' + selectedHeroes[0].role;
}

document.getElementById('addCustomHeroBtn').addEventListener('click', ()=>{
  const input = document.getElementById('customHeroInput');
  const name = input.value.trim();
  if(!name) return;
  const custom = {name, role: selectedRole, en:null};
  if(!HEROES.find(h=>h.name===custom.name && h.role===custom.role)){
    HEROES.push(custom);
  }
  input.value = '';
  if(!isHeroChecked(custom)) toggleHeroChecked(custom);
});

/* ---------------------------------------------------------
   맵 검색/선택 (영웅 선택기와 동일한 구조지만 즐겨찾기는 없음)
--------------------------------------------------------- */
const mapSearchInput = document.getElementById('mapSearch');
const mapListEl = document.getElementById('mapList');
const mapTrigger = document.getElementById('mapTrigger');
const mapTriggerModeTag = document.getElementById('mapTriggerModeTag');
const mapTriggerName = document.getElementById('mapTriggerName');
const mapPanel = document.getElementById('mapPanel');

function getDefaultMap(){ return MAPS[0] || null; }

// 모드 태그 색상용 클래스명
const MODE_CLASS = {"쟁탈":"mode-control","호위":"mode-escort","혼합":"mode-hybrid","밀기":"mode-push","플래시포인트":"mode-flashpoint","격돌":"mode-clash"};
function setModeTag(el, mode){
  el.className = 'map-mode-tag' + (MODE_CLASS[mode] ? ' ' + MODE_CLASS[mode] : '');
  el.textContent = mode || '커스텀';
}

function openMapPanel(){
  mapPanel.classList.add('open');
  mapTrigger.classList.add('open');
  mapSearchInput.value = '';
  renderMapList();
  setTimeout(()=> mapSearchInput.focus(), 0);
}
function closeMapPanel(){
  mapPanel.classList.remove('open');
  mapTrigger.classList.remove('open');
}
function toggleMapPanel(){
  if(mapPanel.classList.contains('open')) closeMapPanel();
  else openMapPanel();
}
mapTrigger.addEventListener('click', toggleMapPanel);

function renderMapList(){
  const q = mapSearchInput.value.trim().toLowerCase();
  const list = MAPS.filter(m=>{
    if(!q) return true;
    return m.name.toLowerCase().includes(q) || (m.mode||'').toLowerCase().includes(q);
  });
  mapListEl.innerHTML = '';
  if(list.length === 0){
    mapListEl.innerHTML = '<div style="color:var(--sub);font-size:12px;padding:8px;">검색 결과가 없습니다. 아래에서 직접 추가해보세요.</div>';
    return;
  }
  list.forEach(m=>{
    const item = document.createElement('div');
    item.className = 'hero-item' + (selectedMap && selectedMap.name===m.name ? ' selected' : '');
    const modeTag = document.createElement('span');
    setModeTag(modeTag, m.mode);
    const nameEl = document.createElement('div');
    nameEl.className = 'hname'; nameEl.textContent = m.name;
    item.appendChild(modeTag); item.appendChild(nameEl);
    item.addEventListener('click', ()=> selectMap(m));
    mapListEl.appendChild(item);
  });
}
mapSearchInput.addEventListener('input', renderMapList);

function selectMap(m, opts){
  opts = opts || {};
  selectedMap = m;
  setModeTag(mapTriggerModeTag, m.mode);
  mapTriggerName.textContent = m.name;
  if(!opts.keepPanel) closeMapPanel();
  renderMapList();
}

document.getElementById('addCustomMapBtn').addEventListener('click', ()=>{
  const input = document.getElementById('customMapInput');
  const name = input.value.trim();
  if(!name) return;
  const custom = {name, mode:null};
  if(!MAPS.find(m=>m.name===custom.name)){
    MAPS.push(custom);
  }
  input.value = '';
  selectMap(custom);
});

--------------------------------------------------------- */
const overlay = document.getElementById('overlay');
const form = document.getElementById('recordForm');
const modalTitle = document.getElementById('modalTitle');

function openModal(editRecord){
  editingId = editRecord ? editRecord.id : null;
  modalTitle.textContent = editRecord ? '기록 수정' : '새 기록 추가';
  closeHeroPanel();
  closeMapPanel();
  if(editRecord){
    document.getElementById('f-date').value = editRecord.date;
    document.getElementById('f-result').value = editRecord.result;
    tierSelect.value = editRecord.tier;
    refreshDivisionOptions();
    if(editRecord.division) divisionSelect.value = editRecord.division;
    refreshTierPreview();
    document.getElementById('f-progress').value = (editRecord.progress===null || editRecord.progress===undefined) ? '' : editRecord.progress;
    selectMap(editRecord.map || getDefaultMap(), {keepPanel:true});
    setRole(editRecord.role);
    selectedHeroes = (Array.isArray(editRecord.heroes) && editRecord.heroes.length)
      ? editRecord.heroes.slice()
      : (editRecord.hero ? [editRecord.hero] : []);
    updateHeroTriggerDisplay();
    renderHeroList();
    document.getElementById('f-kills').value = editRecord.stats.kills ?? '';
    document.getElementById('f-deaths').value = editRecord.stats.deaths ?? '';
    document.getElementById('f-assists').value = editRecord.stats.assists ?? '';
    document.getElementById('f-stat-amount').value = editRecord.stats.amount ?? '';
    document.getElementById('f-memo').value = editRecord.memo || '';
  } else {
    // 맵/메모/스탯은 매번 새로 입력하는 값이라 항상 기본값으로 초기화
    document.getElementById('f-kills').value = '';
    document.getElementById('f-deaths').value = '';
    document.getElementById('f-assists').value = '';
    document.getElementById('f-stat-amount').value = '';
    document.getElementById('f-memo').value = '';
    document.getElementById('customHeroInput').value = '';
    document.getElementById('customMapInput').value = '';
    selectMap(getDefaultMap(), {keepPanel:true});

    // 날짜/결과/티어/진척도/역할군/영웅은 마지막으로 저장했던 값을 그대로 이어서 사용
    const lastForm = loadLastFormFromStorage();
    if(lastForm){
      document.getElementById('f-date').value = lastForm.date || new Date().toISOString().slice(0,10);
      document.getElementById('f-result').value = lastForm.result || 'WIN';
      tierSelect.value = lastForm.tier || 'gold';
      refreshDivisionOptions();
      if(lastForm.division) divisionSelect.value = lastForm.division;
      refreshTierPreview();
      document.getElementById('f-progress').value = (lastForm.progress===null || lastForm.progress===undefined) ? '' : lastForm.progress;
      setRole(lastForm.role || '딜러');
      selectedHeroes = Array.isArray(lastForm.heroes) ? lastForm.heroes.slice() : [];
      updateHeroTriggerDisplay();
      renderHeroList();
    } else {
      document.getElementById('f-result').value = 'WIN';
      document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
      tierSelect.value = 'gold';
      refreshDivisionOptions();
      refreshTierPreview();
      document.getElementById('f-progress').value = '';
      selectedHeroes = [];
      setRole('딜러');
    }
  }
  overlay.classList.add('open');
}
function closeModal(){
  overlay.classList.remove('open');
  editingId = null;
}
document.getElementById('openAddBtn').addEventListener('click', ()=> openModal(null));
document.getElementById('cancelBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });

--------------------------------------------------------- */
function saveRecord(e){
  if(e && e.preventDefault) e.preventDefault();
  try{
  // 혹시라도 체크된 영웅/맵이 없으면(예외 상황) 기본값으로 대체하고 진행
  if(!selectedHeroes || selectedHeroes.length === 0){
    const def = getDefaultHeroForRole(selectedRole);
    selectedHeroes = def ? [def] : [{name:'알 수 없음', role:selectedRole, en:null}];
  }
  if(!selectedMap){
    selectedMap = getDefaultMap() || {name:'알 수 없음', mode:null};
  }
  const dateVal = document.getElementById('f-date').value || new Date().toISOString().slice(0,10);
  const rec = {
    id: editingId || uid(),
    date: dateVal,
    result: document.getElementById('f-result').value,
    tier: tierSelect.value,
    division: divisionSelect.style.display === 'none' ? null : Number(divisionSelect.value),
    progress: clampProgress(numOrNull('f-progress')),
    map: selectedMap,
    role: selectedRole,
    heroes: selectedHeroes.slice(),
    stats: {
      kills: numOrNull('f-kills'),
      deaths: numOrNull('f-deaths'),
      assists: numOrNull('f-assists'),
      amount: numOrNull('f-stat-amount'),
    },
    memo: document.getElementById('f-memo').value.trim(),
  };
  if(editingId){
    const idx = records.findIndex(r=>r.id===editingId);
    if(idx>-1) records[idx] = rec;
  } else {
    records.unshift(rec);
  }
  saveRecordsToStorage();
  // 맵/메모/스탯을 제외한 나머지 입력값은 다음 "새 기록 추가" 시 그대로 이어서 쓸 수 있게 기억해둠
  saveLastFormToStorage({
    date: rec.date,
    result: rec.result,
    tier: rec.tier,
    division: rec.division,
    progress: rec.progress,
    role: rec.role,
    heroes: rec.heroes,
  });
  closeModal();
  renderAll();
  }catch(err){
    console.error('기록 저장 중 오류:', err);
    alert('기록을 저장하는 중 문제가 발생했습니다: ' + (err && err.message ? err.message : err));
  }
}
document.getElementById('saveBtn').addEventListener('click', saveRecord);
function numOrNull(id){
  const v = document.getElementById(id).value;
  return v === '' ? null : Number(v);
}

/* ---------------------------------------------------------
   카드 렌더링
--------------------------------------------------------- */
const cardGrid = document.getElementById('cardGrid');

/* 날짜가 바뀌는 지점(그 날의 기록들이 끝나는 곳)에 끼워넣을 요약 행을 만듦.
   dayTopRec: 그 날 기록들 중 가장 나중에 추가된(=그 날의 최종 상태) 기록
   delta: dayTopRec와, 그 날이 시작되기 직전 기록 사이의 진척도 변화량(cross-tier 계산 포함) */
function buildDaySummaryRow(dayTopRec, delta){
  const t = tierInfo(dayTopRec.tier);
  const tierLabel = t.label + (dayTopRec.division ? (' ' + dayTopRec.division) : '');
  const row = document.createElement('div');
  row.className = 'day-summary-row';
  let deltaHtml;
  if(delta === null || delta === undefined){
    deltaHtml = '<span class="day-summary-delta flat">—</span>';
  } else {
    const sign = delta > 0 ? '+' : (delta < 0 ? '' : '±');
    const cls = delta > 0 ? 'up' : (delta < 0 ? 'down' : 'flat');
    const arrow = delta > 0 ? '▲' : (delta < 0 ? '▼' : '-');
    deltaHtml = `<span class="day-summary-delta ${cls}">${arrow} ${sign}${delta}%</span>`;
  }
  row.innerHTML = `
    <span class="day-summary-date">📅 ${esc(dayTopRec.date)}</span>
    <span class="day-summary-sep">·</span>
    <span class="day-summary-tier"><img src="${tierIconDataUrl(t)}" alt="${esc(t.label)}">이 날 최종 <strong>${esc(tierLabel)}</strong></span>
    <span class="day-summary-sep">·</span>
    <span class="day-summary-total">이 날 총 변화 ${deltaHtml}</span>
  `;
  return row;
}

/* records(최신순)를 날짜가 같은 연속 구간끼리 묶음.
   각 그룹의 start=그 날짜 중 가장 최근에 추가된 기록 인덱스, end=가장 오래된(그 날의 첫 기록) 인덱스 */
function computeDayGroups(recs){
  const groups = [];
  let i = 0;
  while(i < recs.length){
    let j = i;
    while(j + 1 < recs.length && recs[j+1].date === recs[i].date) j++;
    groups.push({start:i, end:j, date:recs[i].date});
    i = j + 1;
  }
  return groups;
}

function renderCards(){
  cardGrid.innerHTML = '';
  if(records.length === 0){
    cardGrid.innerHTML = '<div class="empty-state">아직 기록이 없습니다.<br>상단의 "＋ 기록 추가" 버튼을 눌러 첫 전적을 기록해보세요.</div>';
    return;
  }
  const dayGroups = computeDayGroups(records);
  let groupIdx = 0;
  records.forEach((rec, recIdx)=>{
    while(dayGroups[groupIdx] && recIdx > dayGroups[groupIdx].end) groupIdx++;
    const t = tierInfo(rec.tier);
    const roleClass = ROLE_CLASS[rec.role];
    const card = document.createElement('div');
    card.className = 'card ' + (rec.result==='WIN' ? 'result-win' : rec.result==='LOSE' ? 'result-lose' : '');
    const cardRow = document.createElement('div');
    cardRow.className = 'card-row';

    // 1. 역할군 (맨 왼쪽 칸)
    const roleCol = document.createElement('div');
    roleCol.className = 'col-role';
    roleCol.innerHTML = `<span class="role-tag role-${roleClass}">${ROLE_ICON[rec.role]} ${esc(rec.role)}</span>`;

    // 3. 영웅 초상화 (2명 이상이면 왼쪽부터 겹쳐서, 마지막에 체크한 영웅이 맨 위로)
    const heroCol = document.createElement('div');
    heroCol.className = 'col-hero card-title';
    mountPortraitStack(heroCol, rec.heroes, {size:32});

    // 4. 티어 (예: "골드 5", '단계' 텍스트 없이 볼드 표기)
    const tierCol = document.createElement('div');
    tierCol.className = 'col-tier tier-badge';
    const tImg = document.createElement('img');
    tImg.src = tierIconDataUrl(t);
    tImg.alt = t.label;
    const tLabel = document.createElement('span');
    tLabel.className = 'tier-label';
    tLabel.textContent = t.label + (rec.division ? (' ' + rec.division) : '');
    tierCol.appendChild(tImg); tierCol.appendChild(tLabel);

    // 4. 진척도 (%) - 다음(더 과거) 기록과 비교한 변화량을 작게 함께 표시
    const progressCol = document.createElement('div');
    progressCol.className = 'col-progress progress-cell';
    if(rec.progress !== null && rec.progress !== undefined){
      const prevRec = records[recIdx + 1];
      const delta = computeProgressDelta(rec, prevRec);
      let deltaHtml = '';
      if(delta !== null){
        const sign = delta > 0 ? '+' : (delta < 0 ? '' : '±');
        const cls = delta > 0 ? 'up' : (delta < 0 ? 'down' : 'flat');
        const arrow = delta > 0 ? '▲' : (delta < 0 ? '▼' : '-');
        deltaHtml = `<span class="progress-delta ${cls}">${arrow} ${sign}${delta}%</span>`;
      }
      progressCol.innerHTML = `<span class="progress-value">${rec.progress}%</span>${deltaHtml}`;
    } else {
      progressCol.innerHTML = '<span class="stat-empty">—</span>';
    }

    // 4. 맵
    const mapCol = document.createElement('div');
    mapCol.className = 'col-map map-cell';
    if(rec.map){
      mapCol.innerHTML = `<span class="map-mode-icon">${MODE_ICON[rec.map.mode] || '🗺'}</span><span class="map-name">${esc(rec.map.name)}</span>`;
    } else {
      mapCol.innerHTML = '<span class="stat-empty">—</span>';
    }

    // 4. 날짜
    const dateCol = document.createElement('div');
    dateCol.className = 'col-date date-text';
    dateCol.textContent = rec.date;

    // 5. 결과
    const resultCol = document.createElement('div');
    resultCol.className = 'col-result';
    resultCol.innerHTML = `<span class="result-pill ${rec.result}">${rec.result==='WIN'?'승리':rec.result==='LOSE'?'패배':'무승부'}</span>`;

    // 6. K/A/D 칸: 킬/어시스트/데스 숫자만 (라벨 없음)
    const kdaCol = document.createElement('div');
    kdaCol.className = 'col-kda';
    const s = rec.stats;
    const kda = [s.kills, s.assists, s.deaths];
    const hasAnyKda = kda.some(v => v!==null && v!==undefined);
    if(hasAnyKda){
      const kdaVals = kda.map(v => (v!==null && v!==undefined) ? v : 0);
      kdaCol.innerHTML = `<span class="kda-value">`
        + `<span class="kda-kill">${kdaVals[0]}</span>`
        + `<span class="kda-sep">/</span>`
        + `<span>${kdaVals[1]}</span>`
        + `<span class="kda-sep">/</span>`
        + `<span class="kda-death">${kdaVals[2]}</span>`
        + `</span>`;
    } else {
      kdaCol.innerHTML = '<span class="stat-empty">—</span>';
    }

    // 7. 딜량/힐량 칸: 숫자만 (라벨 없이 색으로만 구분 - 딜량은 주황, 힐량은 초록)
    const amountCol = document.createElement('div');
    amountCol.className = 'col-amount';
    const hasAmount = s.amount !== null && s.amount !== undefined;
    if(hasAmount){
      const amountColorClass = rec.role === '힐러' ? 'amount-heal' : 'amount-dmg';
      amountCol.innerHTML = `<span class="amount-value ${amountColorClass}">${s.amount}</span>`;
    } else {
      amountCol.innerHTML = '<span class="stat-empty">—</span>';
    }

    // 7. 메모 (길면 접기/펼치기 버튼)
    const memoCol = document.createElement('div');
    memoCol.className = 'col-memo';
    const isExpanded = expandedMemos.has(rec.id);
    if(rec.memo){
      const memoCell = document.createElement('div');
      memoCell.className = 'memo-cell';
      const memoBox = document.createElement('div');
      memoBox.className = 'memo-box';
      memoBox.textContent = rec.memo;
      memoBox.title = rec.memo;
      const toggle = document.createElement('span');
      toggle.className = 'memo-toggle';
      toggle.textContent = isExpanded ? '▴' : '▾';
      toggle.title = isExpanded ? '접기' : '전체 메모 보기';
      toggle.style.display = 'none'; // 길이 측정 후 필요할 때만 노출
      // 삼각형 버튼뿐 아니라 셀 전체를 클릭해도 펼치기/접기가 되도록
      memoCell.addEventListener('click', ()=>{
        if(expandedMemos.has(rec.id)) expandedMemos.delete(rec.id);
        else expandedMemos.add(rec.id);
        renderCards();
      });
      memoCell.appendChild(memoBox);
      memoCell.appendChild(toggle);
      memoCol.appendChild(memoCell);
    } else {
      memoCol.innerHTML = '<span class="memo-box memo-empty">—</span>';
    }

    // 8. 관리 버튼
    const actionsCol = document.createElement('div');
    actionsCol.className = 'col-actions card-actions';
    const editBtn = document.createElement('button');
    editBtn.className = 'btn-secondary'; editBtn.textContent = '✏️';
    editBtn.title = '수정'; editBtn.setAttribute('aria-label', '수정');
    editBtn.addEventListener('click', ()=> openModal(rec));
    const delBtn = document.createElement('button');
    delBtn.className = 'btn-danger'; delBtn.textContent = '🗑️';
    delBtn.title = '삭제'; delBtn.setAttribute('aria-label', '삭제');
    delBtn.addEventListener('click', ()=>{
      if(confirm('이 기록을 삭제할까요?')){
        records = records.filter(r=>r.id!==rec.id);
        saveRecordsToStorage();
        renderAll();
      }
    });
    actionsCol.appendChild(editBtn); actionsCol.appendChild(delBtn);

    cardRow.appendChild(roleCol);
    cardRow.appendChild(heroCol);
    cardRow.appendChild(tierCol);
    cardRow.appendChild(progressCol);
    cardRow.appendChild(mapCol);
    cardRow.appendChild(dateCol);
    cardRow.appendChild(resultCol);
    cardRow.appendChild(kdaCol);
    cardRow.appendChild(amountCol);
    cardRow.appendChild(memoCol);
    cardRow.appendChild(actionsCol);
    card.appendChild(cardRow);

    // 메모 펼침 패널 (접기/펼치기 버튼을 누르면 아래로 확장되어 전체 메모를 보여줌)
    if(rec.memo && isExpanded){
      const fullPanel = document.createElement('div');
      fullPanel.className = 'memo-full-panel';
      const fullText = document.createElement('div');
      fullText.className = 'memo-full-text';
      fullText.textContent = rec.memo;
      fullPanel.appendChild(fullText);
      card.appendChild(fullPanel);
    }

    cardGrid.appendChild(card);

    // 현재 날짜 그룹의 마지막(가장 오래된) 기록까지 다 그렸다면, 바로 다음(더 과거) 날짜 그룹의
    // 요약 행을 끼워넣음. 총 변화는 그 그룹 자체의 첫 기록→마지막 기록 사이 변화량(티어가 그대로여도
    // 진척도만 바뀐 경우까지 포함)이라서 다른 날짜와는 무관하게 항상 계산됨.
    const curGroup = dayGroups[groupIdx];
    if(curGroup && recIdx === curGroup.end){
      const nextGroup = dayGroups[groupIdx + 1];
      if(nextGroup){
        const dayTopRec = records[nextGroup.start];
        const dayBottomRec = records[nextGroup.end];
        const dayDelta = computeProgressDelta(dayTopRec, dayBottomRec);
        cardGrid.appendChild(buildDaySummaryRow(dayTopRec, dayDelta));
      }
    }
  });

  // 메모가 실제로 잘려서 보이는(overflow) 행에만 접기/펼치기 버튼을 표시
  cardGrid.querySelectorAll('.memo-cell').forEach(cell=>{
    const box = cell.querySelector('.memo-box');
    const toggle = cell.querySelector('.memo-toggle');
    if(!box || !toggle) return;
    const isTruncated = box.scrollWidth > box.clientWidth + 1;
    if(isTruncated || toggle.textContent === '▴'){
      toggle.style.display = 'inline-flex';
      cell.style.cursor = 'pointer';
    }
  });
}

/* ---------------------------------------------------------
   요약 통계
--------------------------------------------------------- */
function avgOf(values){
  const vals = values.filter(v => v!==null && v!==undefined);
  if(!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}

function renderSummary(){
  const bar = document.getElementById('summaryBar');
  const total = records.length;
  const wins = records.filter(r=>r.result==='WIN').length;
  const loses = records.filter(r=>r.result==='LOSE').length;
  const draws = records.filter(r=>r.result==='DRAW').length;
  const winRate = total ? Math.round((wins/(wins+loses||1))*100) : 0;

  // 평균 KDA (킬/어시스트/데스 순서로 표기, 각 항목별로 기록이 있는 경기만 평균)
  const avgK = avgOf(records.map(r=>r.stats.kills));
  const avgA = avgOf(records.map(r=>r.stats.assists));
  const avgD = avgOf(records.map(r=>r.stats.deaths));
  let kdaText = '-';
  if(avgK!==null || avgA!==null || avgD!==null){
    const f = v => v===null ? '-' : v.toFixed(1);
    kdaText = `${f(avgK)} / ${f(avgA)} / ${f(avgD)}`;
  }

  // 평균 딜량(탱커/딜러) · 평균 힐량(힐러) - 해당 역할군에서 딜/힐량이 기록된 경기만 평균
  const dmgVals = records.filter(r=>r.role!=='힐러').map(r=>r.stats.amount).filter(v=>v!==null && v!==undefined);
  const healVals = records.filter(r=>r.role==='힐러').map(r=>r.stats.amount).filter(v=>v!==null && v!==undefined);
  const avgDmg = dmgVals.length ? Math.round(dmgVals.reduce((a,b)=>a+b,0)/dmgVals.length) : null;
  const avgHeal = healVals.length ? Math.round(healVals.reduce((a,b)=>a+b,0)/healVals.length) : null;

  bar.innerHTML = `
    <div class="stat-tile"><div class="num">${total}</div><div class="lbl">총 기록</div></div>
    <div class="stat-tile win"><div class="num">${wins}</div><div class="lbl">승</div></div>
    <div class="stat-tile lose"><div class="num">${loses}</div><div class="lbl">패</div></div>
    <div class="stat-tile"><div class="num">${draws}</div><div class="lbl">무</div></div>
    <div class="stat-tile"><div class="num">${winRate}%</div><div class="lbl">승률</div></div>
    <div class="stat-tile"><div class="num num-sm">${kdaText}</div><div class="lbl">평균 K/A/D</div></div>
    <div class="stat-tile"><div class="num num-sm">${avgDmg!==null ? avgDmg.toLocaleString() : '-'}</div><div class="lbl">평균 딜량</div></div>
    <div class="stat-tile"><div class="num num-sm">${avgHeal!==null ? avgHeal.toLocaleString() : '-'}</div><div class="lbl">평균 힐량</div></div>
  `;
}

function renderAll(){ renderCards(); renderSummary(); }

/* ---------------------------------------------------------
   내보내기 / 불러오기
--------------------------------------------------------- */
document.getElementById('exportJsonBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(records, null, 2)], {type:'application/json'});
  downloadBlob(blob, `overwatch_records_${todayStr()}.json`);
});
document.getElementById('exportCsvBtn').addEventListener('click', ()=>{
  const header = ['날짜','결과','티어','단계','진척도(%)','맵','역할군','영웅','킬','데스','어시스트','스탯구분','스탯값','메모'];
  const rows = records.map(r=>[
    r.date, r.result, tierInfo(r.tier).label, r.division ?? '',
    (r.progress ?? ''),
    r.map ? r.map.name : '',
    r.role, (r.heroes||[]).map(h=>h.name).join(' / '), r.stats.kills ?? '', r.stats.deaths ?? '', r.stats.assists ?? '',
    statLabelForRole(r.role), r.stats.amount ?? '',
    (r.memo||'').replace(/\n/g,' ').replace(/"/g,'""')
  ]);
  const csv = [header, ...rows].map(row => row.map(v=>`"${v}"`).join(',')).join('\n');
  const blob = new Blob(["﻿"+csv], {type:'text/csv;charset=utf-8;'});
  downloadBlob(blob, `overwatch_records_${todayStr()}.csv`);
});
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }

document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data)) throw new Error('형식 오류');
      records = data.map(normalizeRecord);
      saveRecordsToStorage();
      renderAll();
      alert(`${data.length}건의 기록을 불러왔습니다.`);
    }catch(err){
      alert('JSON 파일을 읽을 수 없습니다. 이 사이트에서 내보낸 파일인지 확인해주세요.');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

document.getElementById('clearAllBtn').addEventListener('click', ()=>{
  if(records.length===0) return;
  if(confirm('모든 기록을 삭제할까요? 이 작업은 되돌릴 수 없습니다. (삭제 전 JSON 내보내기를 권장합니다)')){
    records = [];
    saveRecordsToStorage();
    renderAll();
  }
});

/* ---------------------------------------------------------
   다크 모드 / 라이트 모드 전환
--------------------------------------------------------- */
const themeToggleBtn = document.getElementById('themeToggleBtn');
const themeToggleIcon = document.getElementById('themeToggleIcon');
const themeToggleLabel = document.getElementById('themeToggleLabel');
let currentTheme = 'dark';
function applyTheme(theme){
  currentTheme = theme;
  if(theme === 'light'){
    document.documentElement.setAttribute('data-theme', 'light');
    themeToggleIcon.textContent = '☀️';
    themeToggleLabel.textContent = '라이트 모드';
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeToggleIcon.textContent = '🌙';
    themeToggleLabel.textContent = '다크 모드';
  }
}
themeToggleBtn.addEventListener('click', ()=>{
  applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
});
applyTheme('light');

/* ---------------------------------------------------------
   제목 / 소제목 편집
--------------------------------------------------------- */
const titleEditBtn = document.getElementById('titleEditBtn');
const headerTitleEl = document.getElementById('headerTitle');
const headerSubtitleEl = document.getElementById('headerSubtitle');
let titleEditing = false;
function setTitleEditing(on){
  titleEditing = on;
  headerTitleEl.setAttribute('contenteditable', on ? 'true' : 'false');
  headerSubtitleEl.setAttribute('contenteditable', on ? 'true' : 'false');
  titleEditBtn.classList.toggle('active', on);
  titleEditBtn.textContent = on ? '✅' : '✏️';
  titleEditBtn.title = on ? '편집 완료' : '제목 편집';
  titleEditBtn.setAttribute('aria-label', on ? '편집 완료' : '제목 편집');
  if(on){
    headerTitleEl.focus();
    // 커서를 텍스트 끝으로 이동
    const range = document.createRange();
    range.selectNodeContents(headerTitleEl);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  } else {
    saveTitleToStorage(headerTitleEl.textContent, headerSubtitleEl.textContent);
  }
}
titleEditBtn.addEventListener('click', ()=>{
  setTitleEditing(!titleEditing);
});
[headerTitleEl, headerSubtitleEl].forEach(el=>{
  el.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      e.preventDefault();
      setTitleEditing(false);
    }
  });
});

/* ---------------------------------------------------------
   초기 렌더 (저장된 기록/제목 복원 후 렌더)
--------------------------------------------------------- */
loadRecordsFromStorage();
const savedTitle = loadTitleFromStorage();
if(savedTitle.title) headerTitleEl.textContent = savedTitle.title;
if(savedTitle.subtitle) headerSubtitleEl.textContent = savedTitle.subtitle;
renderAll();
</script>
